services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9-grpc
    environment:
      MODEL_ID: "${EMBEDDING_MODEL:?Define EMBEDDING_MODEL}"
      REVISION: "${EMBEDDING_REVISION:?Define EMBEDDING_REVISION}"
    command: ["--port", "80"]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - tei-bge-m3-cache:/data
volumes:
  qdrant-data:
  tei-bge-m3-cache:
