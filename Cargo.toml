[package]
name = "rag"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
dotenvy = "0.15"
futures-util = "0.3"
prost = "0.14"
percent-encoding = "2"
qdrant-client = { version = "1.19", default-features = false, features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "rustls", "stream", "multipart"], default-features = false }
rig = { version = "0.42", default-features = false, features = ["derive", "reqwest", "rustls"] }
rig-qdrant = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "time", "net", "sync", "signal", "io-util"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
tonic-prost-build = "0.14"
