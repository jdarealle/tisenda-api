[package]
name = "rag"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
dotenvy = "0.15"
futures-util = "0.3"
prost = "0.14"
percent-encoding = "2"
qdrant-client = { version = "1.19", default-features = false, features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "rustls", "stream", "multipart"], default-features = false }
rig = { version = "=0.44.0", default-features = false, features = ["derive", "reqwest", "rustls", "qdrant"] }
scalar_api_reference = "0.2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "fs", "time", "net", "sync", "signal", "io-util"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
uuid = { version = "1.28.0", features = ["v4", "v5", "v7", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
tonic-prost-build = "0.14"
