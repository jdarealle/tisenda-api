// Campos y servicios usados del contrato público tei.v1 de TEI v1.9.4:
// https://github.com/huggingface/text-embeddings-inference/blob/v1.9.4/proto/tei.proto
syntax = "proto3";

package tei.v1;

service Info {
  rpc Info (InfoRequest) returns (InfoResponse);
}

service Embed {
  rpc Embed (EmbedRequest) returns (EmbedResponse);
}

service Tokenize {
  rpc Tokenize (EncodeRequest) returns (EncodeResponse);
}

message EncodeRequest {
  string inputs = 1;
  bool add_special_tokens = 2;
  optional string prompt_name = 3;
}

message SimpleToken {
  uint32 id = 1;
  string text = 2;
  bool special = 3;
  optional uint32 start = 4;
  optional uint32 stop = 5;
}

message EncodeResponse {
  repeated SimpleToken tokens = 1;
}

message InfoRequest {}

message InfoResponse {
  string model_id = 4;
  optional string model_sha = 5;
  string model_dtype = 6;
  uint32 max_input_length = 9;
  uint32 max_batch_tokens = 10;
  uint32 max_client_batch_size = 12;
}

message EmbedRequest {
  string inputs = 1;
  bool truncate = 2;
  optional bool normalize = 3;
}

message EmbedResponse {
  repeated float embeddings = 1;
}
